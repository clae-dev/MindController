<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 얼굴 분석에 필요한 대용량 자산(모델 3.7MB + WASM 11MB)을 HTML 파싱 시점부터
         받기 시작한다. JS 번들 로드 → React 마운트 후에야 fetch가 시작되던 것을 앞당겨
         "준비하고 있어요…" 대기 시간을 줄인다. as=fetch는 저우선순위라 첫 화면 렌더링을
         막지 않으며, 워커에서의 실제 요청은 HTTP 캐시(immutable)로 이 응답을 재사용한다.
         (nosimd 변형은 구형 브라우저 폴백용이라 preload하지 않음) -->
    <link rel="preload" href="/mediapipe/wasm/vision_wasm_internal.wasm" as="fetch" fetchpriority="low" crossorigin />
    <link rel="preload" href="/mediapipe/wasm/vision_wasm_internal.js" as="fetch" fetchpriority="low" crossorigin />
    <link rel="preload" href="/models/face_landmarker.task" as="fetch" fetchpriority="low" crossorigin />
    <link rel="preload" href="/warmup-face.jpg" as="fetch" fetchpriority="low" crossorigin />

    <!-- 폰트 CSS는 비차단 로드 — 시스템 폰트로 먼저 그리고 로드 완료 시 교체(FOUT 허용).
         렌더 블로킹 외부 CSS 2개(jsdelivr + Google Fonts)가 FCP를 늦추던 것을 제거 -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap"
      />
    </noscript>
    <title>마음 들여다보기 · MindController</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
